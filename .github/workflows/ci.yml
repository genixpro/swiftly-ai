name: CI
on: [push, pull_request]
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check_no_secrets.sh
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff check app/services app/repositories.py app/routers --select F,I,B,UP,SIM,C90
      - run: pytest -q --cov=app.services --cov-report=term-missing --cov-fail-under=85
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22.22.0, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run test -- --passWithNoTests
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:bundle
  e2e:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22.22.0, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: API_PORT=8000 WEB_PORT=5173 docker compose -f ../docker-compose.yml up --build -d
      - run: curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://localhost:8000/health
      - run: E2E_BASE_URL=http://localhost:5173 npm run test:e2e
      - run: E2E_BASE_URL=http://localhost:5173 npm run test:visual
      - if: always()
        run: API_PORT=8000 WEB_PORT=5173 docker compose -f ../docker-compose.yml down -v
